query MyNotifications($first: Int = 30) {
  myNotifications(first: $first) {
    id
    type
    entityType
    entityId
    readAt
    createdAt
    actor {
      id
      username
      displayName
      avatarMediaId
    }
  }
}

query UnreadNotifications {
  unreadNotifications
}

mutation MarkNotificationsRead {
  markNotificationsRead
}

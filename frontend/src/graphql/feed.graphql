query FollowingFeed($first: Int = 20, $cursor: String) {
  followingFeed(first: $first, cursor: $cursor) {
    posts {
      id
      type
      body
      editedAt
      createdAt
      commentCount
      reactionCount
      myReaction
      isSaved
      mediaIds
      mediaUrls
      author {
        id
        username
        displayName
        avatarMediaId
      }
    }
    nextCursor
  }
}

query MemberPosts($username: String!, $first: Int = 20) {
  memberPosts(username: $username, first: $first) {
    id
    type
    body
    editedAt
    createdAt
    commentCount
    reactionCount
    myReaction
    isSaved
    mediaIds
    mediaUrls
    author {
      id
      username
      displayName
      avatarMediaId
    }
  }
}

query DiscoverFeed($first: Int = 20, $cursor: String) {
  discoverFeed(first: $first, cursor: $cursor) {
    posts {
      id
      type
      body
      createdAt
      commentCount
      reactionCount
      author {
        id
        username
        displayName
        avatarMediaId
      }
    }
    nextCursor
  }
}

mutation CreatePost($type: PostType!, $body: String, $mediaIds: [ID!]) {
  createPost(type: $type, body: $body, mediaIds: $mediaIds) {
    id
    type
    body
    createdAt
    author {
      id
      username
      displayName
    }
  }
}

mutation ReactToPost($id: ID!, $type: ReactionType!) {
  reactToPost(id: $id, type: $type) {
    count
    myReaction
  }
}

mutation UnreactToPost($id: ID!) {
  unreactToPost(id: $id)
}

mutation CreateComment($postId: ID!, $parentId: ID, $body: String!) {
  createComment(postId: $postId, parentId: $parentId, body: $body) {
    id
    postId
    body
    createdAt
    author {
      id
      username
      displayName
      avatarMediaId
    }
    reactionCount
    myReaction
  }
}

query PostComments($postId: ID!, $first: Int = 50) {
  postComments(postId: $postId, first: $first) {
    id
    body
    createdAt
    author {
      id
      username
      displayName
    }
  }
}

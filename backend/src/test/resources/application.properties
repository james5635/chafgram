# Integration tests run against the dev MySQL from compose.yaml, in the dev
# `chafgram` schema — the same schema `just dev` uses. WARNING: the test suite
# wipes and re-creates the tables every run. Run `just seed` afterwards to
# restore the dev fixtures.
#
# Start MySQL with `just mysql` first. Override the connection with
# CHAFGRAM_TEST_DATASOURCE_URL / _USERNAME / _PASSWORD if you point elsewhere
# (it wipes whatever schema it points at — mind your data).
spring.datasource.url=${CHAFGRAM_TEST_DATASOURCE_URL:jdbc:mysql://localhost:3306/chafgram?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CHAFGRAM_TEST_DATASOURCE_USERNAME:chafgram}
spring.datasource.password=${CHAFGRAM_TEST_DATASOURCE_PASSWORD:chafgram}

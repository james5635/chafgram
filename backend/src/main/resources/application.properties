spring.application.name=chafgram

# Local dev datasource — defaults match compose.yaml and are throwaway
# dev-only credentials. Override with environment variables (or a
# git-ignored profile) for anything shared or production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chafgram?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chafgram}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chafgram}

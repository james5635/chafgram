spring.application.name=chafgram

# Local dev datasource — defaults match compose.yaml and are throwaway
# dev-only credentials. Override with environment variables (or a
# git-ignored profile) for anything shared or production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chafgram?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chafgram}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chafgram}

# Flyway owns the schema (migrations in db/migration/) and is applied by the
# Gradle task :api:flywayMigrate (`just migrate` / `just seed`), not at app boot.
# Hibernate only validates entity mappings — it must never create or update anything.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# WebAuthn relying party. Set the env vars for real deployments.
chafgram.webauthn.rp-id=${CHAFGRAM_WEBAUTHN_RP_ID:localhost}
chafgram.webauthn.allowed-origins=${CHAFGRAM_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:3000}

# Media uploads: 20 MB images, 4 GB videos (matches MediaService limits)
spring.servlet.multipart.max-file-size=4GB
spring.servlet.multipart.max-request-size=4GB

# Account flows (FR-1.7): email verification and password reset.
# Mail is written to the application log unless SMTP is explicitly enabled
# (BR-10.1 — no outbound calls on an air-gapped install).
chafgram.app-url=${CHAFGRAM_APP_URL:http://localhost:3000}
chafgram.mail.smtp-enabled=${CHAFGRAM_MAIL_SMTP_ENABLED:false}
chafgram.mail.from=${CHAFGRAM_MAIL_FROM:chafgram@localhost}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}

# GraphiQL for local development at /graphiql. Disable in production profiles.
spring.graphql.graphiql.enabled=true

# Actuator (FR-10.4). Health is a public liveness probe; info and metrics are
# admin-only (enforced in SecurityConfiguration).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# The mail health check opens an SMTP connection — only run it when SMTP is
# actually turned on (otherwise it would report the instance as DOWN and, on
# an air-gapped install, make an outbound call).
management.health.mail.enabled=${CHAFGRAM_MAIL_SMTP_ENABLED:false}
info.app.name=Chafgram
info.app.description=Private, self-hosted social platform for companies

# Media storage — S3-compatible (Garage in local dev). The local filesystem
# backend is available with CHAFGRAM_MEDIA_BACKEND=local.
chafgram.media.backend=${CHAFGRAM_MEDIA_BACKEND:s3}
chafgram.media.s3.endpoint=${CHAFGRAM_MEDIA_S3_ENDPOINT:http://localhost:3900}
chafgram.media.s3.bucket=${CHAFGRAM_MEDIA_S3_BUCKET:chafgram-media}
chafgram.media.s3.region=${CHAFGRAM_MEDIA_S3_REGION:garage}
chafgram.media.s3.access-key=${GARAGE_ACCESS_KEY:GK67304d5c49c3278bab342460}
chafgram.media.s3.secret-key=${GARAGE_SECRET_KEY:d53617c73b0711ab876d08d4072f4f45a65b7f0a150fcf00d38133737d0040f3}
chafgram.media.storage-root=${CHAFGRAM_MEDIA_STORAGE_ROOT:./build/media-data}

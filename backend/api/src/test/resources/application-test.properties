# Test profile overrides.
#
# Integration tests are hermetic: AbstractIntegrationTest starts a throwaway
# MySQL 8 container via Testcontainers and points the datasource at it through
# system properties (see AbstractIntegrationTest). No dev database is touched;
# Docker must be running.
#
# NOTE: this file must NOT be named `application.properties`. A test-scoped
# `application.properties` shadows the main one on the classpath (the test
# classpath comes first), which silently drops every main configuration value —
# the actuator exposure settings included. Keep test overrides in this
# profile-specific file instead; the `test` profile is activated by
# AbstractIntegrationTest.

